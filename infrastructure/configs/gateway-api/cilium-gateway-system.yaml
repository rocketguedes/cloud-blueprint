apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-gateway-system
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    - name: passthrough
      protocol: TLS
      port: 443
      hostname: connect.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: headscale
      tls:
        mode: Passthrough

    - name: https-accounts
      protocol: HTTPS
      port: 443
      hostname: accounts.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-guedescloud-com-br-tls
            namespace: kube-system

    - name: https-console
      protocol: HTTPS
      port: 443
      hostname: console.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-guedescloud-com-br-tls
            namespace: kube-system

    - name: https-monitoring
      protocol: HTTPS
      port: 443
      hostname: monitoring.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-guedescloud-com-br-tls
            namespace: kube-system

    - name: https-photos
      protocol: HTTPS
      port: 443
      hostname: photos.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-guedescloud-com-br-tls
            namespace: kube-system

    - name: https-wallet
      protocol: HTTPS
      port: 443
      hostname: wallet.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-guedescloud-com-br-tls
            namespace: kube-system
