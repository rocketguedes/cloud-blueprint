apiVersion: batch/v1
kind: Job
metadata:
  name: lldap-bootstrap
  labels:
    app.kubernetes.io/name: lldap
    app.kubernetes.io/instance: lldap
    app.kubernetes.io/component: lldap
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lldap
        app.kubernetes.io/instance: lldap
        app.kubernetes.io/component: lldap
    spec:
      serviceAccountName: lldap
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lldap-bootstrap
          image: docker.io/lldap/lldap
          command:
            - /app/bootstrap.sh
          env:
            - name: LLDAP_URL
              value: "http://lldap-service.lldap.svc.cluster.local:17170"
            - name: LLDAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lldap
                  key: LLDAP_LDAP_USER_DN
            - name: LLDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lldap
                  key: LLDAP_LDAP_USER_PASS
            - name: DO_CLEANUP
              value: "false"
          volumeMounts:
            - name: user-configs
              mountPath: /bootstrap/user-configs
              readOnly: true
            - name: group-configs
              mountPath: /bootstrap/group-configs
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: user-configs
          secret:
            secretName: lldap-bootstrap-configs
            items:
              - key: user-configs.json
                path: user-configs.json
        - name: group-configs
          configMap:
            name: lldap-bootstrap-configs
            items:
              - key: group-configs.json
                path: group-configs.json
