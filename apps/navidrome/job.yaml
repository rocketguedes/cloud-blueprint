apiVersion: batch/v1
kind: Job
metadata:
  name: restoring
  labels:
    app.kubernetes.io/name: navidrome
    app.kubernetes.io/instance: navidrome
spec:
  ttlSecondsAfterFinished: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: navidrome
        app.kubernetes.io/instance: navidrome
    spec:
      serviceAccountName: navidrome
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
        - name: navidrome-restoring
          image: docker.io/deluan/navidrome
          imagePullPolicy: Always
          command:
            - /bin/sh
          args:
            - -c
            - |
              set -eu
              BACKUP=$(ls -t "${ND_BACKUP_PATH}"/*.db 2>/dev/null | head -1 || true)
              if [ -z "${BACKUP}" ]; then
                echo "no backup files found in ${ND_BACKUP_PATH}" >&2
                exit 1
              fi
              exec navidrome backup restore \
                --backup-file "${BACKUP}" \
                --force \
                --datafolder /data \
                --nobanner
          envFrom:
            - configMapRef:
                name: navidrome
          volumeMounts:
            - name: navidrome
              mountPath: /data
            - name: navidrome-toml
              mountPath: /data/navidrome.toml
              subPath: navidrome.toml
              readOnly: true
            - name: backup
              mountPath: /backup
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: backup
        - name: navidrome
          persistentVolumeClaim:
            claimName: navidrome
        - name: navidrome-toml
          configMap:
            name: navidrome-toml
        - name: tmp
          emptyDir: {}
