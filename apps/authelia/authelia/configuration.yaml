---
theme: "auto"
server:
  endpoints:
    rate_limits:
      openid_connect_token:
        enable: false
telemetry:
  metrics:
    enabled: true
    address: "tcp://:9959/metrics"
identity_validation:
  reset_password:
    jwt_secret: '{{ secret "/secrets/AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET" }}'
definitions:
  user_attributes:
    immich_role:
      expression: '"lldap_admin" in groups ? "admin" : "user"'
    immich_quota:
      expression: '"lldap_admin" in groups ? 50 : 15'
authentication_backend:
  refresh_interval: "5 minutes"
  ldap:
    address: "ldap://lldap-service.lldap.svc.cluster.local:3890"
    implementation: "lldap"
    base_dn: "dc=guedescloud,dc=com,dc=br"
    additional_users_dn: "ou=people"
    additional_groups_dn: "ou=groups"
    user: "uid=admin,ou=people,dc=guedescloud,dc=com,dc=br"
access_control:
  default_policy: "deny"
  rules:
    - domain: "*.guedescloud.com.br"
      policy: "one_factor"
session:
  secret: '{{ secret "/secrets/AUTHELIA_SESSION_SECRET" }}'
  cookies:
    - domain: "guedescloud.com.br"
      authelia_url: "https://accounts.guedescloud.com.br"
  inactivity: "14 days"
  expiration: "1 day"
  remember_me: "1 year"
  redis:
    host: "valkey.authelia.svc.cluster.local"
    port: 6379
storage:
  postgres:
    address: "tcp://postgresql-rw.postgresql.svc.cluster.local:5432"
    database: "authelia"
    username: "authelia"
notifier:
  disable_startup_check: false
  filesystem:
    filename: "/config/notification.txt"
identity_providers:
  oidc:
    hmac_secret: '{{ secret "/secrets/AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET" }}'
    jwks:
      - key: |
          {{ secret "/secrets/IDENTITY_PROVIDERS_OIDC_JWKS_KEY" | mindent 10 "" }}
    lifespans:
      refresh_token: "1 year"
    cors:
      endpoints:
        - "userinfo"
        - "token"
      allowed_origins_from_client_redirect_uris: true
    claims_policies:
      default:
        id_token:
          - "email"
          - "email_verified"
          - "name"
          - "preferred_username"
          - "groups"
          - "alt_emails"
      immich_policy:
        custom_claims:
          immich_quota:
            attribute: "immich_quota"
          immich_role:
            attribute: "immich_role"
    scopes:
      immich_scope:
        claims:
          - "immich_quota"
          - "immich_role"
    clients:
      - client_id: "vaultwarden"
        client_name: "vaultwarden"
        client_secret: '{{ secret "/secrets/IDENTITY_PROVIDERS_OIDC_VAULTWARDEN_CLIENT_SECRET" }}'
        public: false
        redirect_uris:
          - "https://wallet.guedescloud.com.br/identity/connect/oidc-signin"
        scopes:
          - "openid"
          - "profile"
          - "email"
          - "offline_access"
        claims_policy: "default"
        grant_types:
          - "authorization_code"
          - "refresh_token"
        response_types:
          - "code"
        authorization_policy: "one_factor"
        consent_mode: "auto"
      - client_id: "immich"
        client_name: "immich"
        client_secret: '{{ secret "/secrets/IDENTITY_PROVIDERS_OIDC_IMMICH_CLIENT_SECRET" }}'
        public: false
        redirect_uris:
          - "https://photos.guedescloud.com.br/auth/login"
          - "https://photos.guedescloud.com.br/user-settings"
          - "app.immich:///oauth-callback"
        scopes:
          - "openid"
          - "profile"
          - "email"
          - "immich_scope"
        claims_policy: "immich_policy"
        grant_types:
          - "authorization_code"
        response_types:
          - "code"
        authorization_policy: "one_factor"
        consent_mode: "implicit"
        token_endpoint_auth_method: "client_secret_post"
      - client_id: "headlamp"
        client_name: "headlamp"
        public: true
        redirect_uris:
          - "https://console.guedescloud.com.br/oidc-callback"
        scopes:
          - "openid"
          - "profile"
          - "email"
          - "groups"
          - "offline_access"
        claims_policy: "default"
        grant_types:
          - "authorization_code"
          - "refresh_token"
        response_types:
          - "code"
        authorization_policy: "one_factor"
        consent_mode: "auto"
        require_pkce: true
        token_endpoint_auth_method: "none"
      - client_id: "grafana"
        client_name: "grafana"
        client_secret: '{{ secret "/secrets/IDENTITY_PROVIDERS_OIDC_GRAFANA_CLIENT_SECRET" }}'
        public: false
        redirect_uris:
          - "https://monitoring.guedescloud.com.br/login/generic_oauth"
        scopes:
          - "openid"
          - "profile"
          - "email"
          - "groups"
        claims_policy: "default"
        grant_types:
          - "authorization_code"
        response_types:
          - "code"
        authorization_policy: "one_factor"
        consent_mode: "implicit"
        require_pkce: true
        token_endpoint_auth_method: "client_secret_basic"
      - client_id: "headscale"
        client_name: "headscale"
        client_secret: '{{ secret "/secrets/IDENTITY_PROVIDERS_OIDC_HEADSCALE_CLIENT_SECRET" }}'
        public: false
        redirect_uris:
          - "https://connect.guedescloud.com.br/oidc/callback"
        scopes:
          - "openid"
          - "profile"
          - "email"
        claims_policy: "default"
        grant_types:
          - "authorization_code"
        response_types:
          - "code"
        authorization_policy: "one_factor"
        consent_mode: "implicit"
        require_pkce: true
        token_endpoint_auth_method: "client_secret_basic"
...
