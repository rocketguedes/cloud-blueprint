apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: audiomuse-ai-flask
  labels:
    app.kubernetes.io/name: audiomuse-ai
    app.kubernetes.io/instance: audiomuse-ai
    app.kubernetes.io/component: flask
spec:
  parentRefs:
    - name: cilium-gateway-system
      namespace: kube-system
      port: 443
  hostnames:
    - discover.guedescloud.com.br
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: audiomuse-ai-flask-service
          port: 8000
