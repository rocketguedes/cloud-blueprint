apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/component: grafana
data:
  GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
  GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
  GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
  GF_ANALYTICS_REPORTING_ENABLED: "false"
  GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
  GF_AUTH_DISABLE_LOGIN_FORM: "true"
  GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
  GF_AUTH_GENERIC_OAUTH_API_URL: https://accounts.guedescloud.com.br/api/oidc/userinfo
  GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://accounts.guedescloud.com.br/api/oidc/authorization
  GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "true"
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
  GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
  GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups
  GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
  GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
  GF_AUTH_GENERIC_OAUTH_NAME: Authelia
  GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(groups[*], 'grafanaadmin') && 'GrafanaAdmin' || contains(groups[*], 'admin') && 'Admin' || contains(groups[*], 'editor') && 'Editor' || 'Viewer'
  GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile groups
  GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: https://accounts.guedescloud.com.br/logout?rd=https://monitoring.guedescloud.com.br/
  GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://accounts.guedescloud.com.br/api/oidc/token
  GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
  GF_CLOUD_MIGRATION_ENABLED: "false"
  GF_DATABASE_HOST: postgresql-rw.postgresql.svc.cluster.local:5432
  GF_DATABASE_NAME: grafana
  GF_DATABASE_SSL_MODE: disable
  GF_DATABASE_TYPE: postgres
  GF_DATABASE_USER: grafana
  GF_HELP_ENABLED: "false"
  GF_NEWS_NEWS_FEED_ENABLED: "false"
  GF_SECURITY_COOKIE_SECURE: "true"
  GF_SECURITY_DISABLE_GRAVATAR: "true"
  GF_SERVER_DOMAIN: monitoring.guedescloud.com.br
  GF_SERVER_ENFORCE_DOMAIN: "true"
  GF_SERVER_ROOT_URL: https://monitoring.guedescloud.com.br/
  GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
  GF_SUPPORT_BUNDLES_ENABLED: "false"
  GF_USERS_ALLOW_ORG_CREATE: "false"
  GF_USERS_ALLOW_SIGN_UP: "false"
