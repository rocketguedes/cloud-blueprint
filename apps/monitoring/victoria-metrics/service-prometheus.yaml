apiVersion: v1
kind: Service
metadata:
  name: prometheus-k8s
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: victoria-metrics-single
    app.kubernetes.io/component: server
    headlamp-prometheus: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: victoria-metrics-single
    app.kubernetes.io/instance: victoria-metrics-single
    app.kubernetes.io/component: server
  ports:
    - name: http
      protocol: TCP
      port: 9090
      targetPort: http
