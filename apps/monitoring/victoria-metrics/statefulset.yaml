apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoria-metrics-single-server
  labels:
    app.kubernetes.io/name: victoria-metrics-single
    app.kubernetes.io/instance: victoria-metrics-single
    app.kubernetes.io/component: server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics-single
      app.kubernetes.io/instance: victoria-metrics-single
      app.kubernetes.io/component: server
  serviceName: victoria-metrics-single-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-metrics-single
        app.kubernetes.io/instance: victoria-metrics-single
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: victoria-metrics-single-server
      terminationGracePeriodSeconds: 60
      containers:
        - name: vmsingle
          image: docker.io/victoriametrics/victoria-metrics
          args:
            - --envflag.enable
            - --envflag.prefix=VM_
            - --httpListenAddr=:8428
            - --loggerFormat=json
            - --promscrape.config=/scrapeconfig/scrape.yml
            - --retentionPeriod=1y
            - --storageDataPath=/storage
          ports:
            - containerPort: 8428
              name: http
          resources:
            limits:
              cpu: 500m
              memory: 768Mi
            requests:
              cpu: 50m
              memory: 256Mi
          volumeMounts:
            - mountPath: /storage
              name: server-volume
            - mountPath: /scrapeconfig
              name: scrapeconfig
          livenessProbe:
            failureThreshold: 3
            periodSeconds: 30
            tcpSocket:
              port: http
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      volumes:
        - configMap:
            name: victoria-metrics-single-server-scrapeconfig
          name: scrapeconfig
  updateStrategy: {}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: server-volume
        labels:
          app.kubernetes.io/name: victoria-metrics-single
          app.kubernetes.io/instance: victoria-metrics-single
          app.kubernetes.io/component: server
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 16Gi
