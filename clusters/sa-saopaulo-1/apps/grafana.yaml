---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: authelia
    - name: cilium-gateway-system
    - name: grafana-postgresql
    - name: namespaces
    - name: victoria-metrics
  interval: 5m0s
  path: ./apps/monitoring/grafana
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m0s
  wait: true
