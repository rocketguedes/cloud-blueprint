---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authelia-valkey
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
    - name: namespaces
  interval: 5m0s
  path: ./apps/authelia/valkey
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m0s
  wait: true
